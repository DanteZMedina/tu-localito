<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tu localito - Catálogo</title>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="icon" type="image/png" href="../img/favicon-32x32.png">


  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css?family=JetBrains+Mono" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playwrite+HU:wght@100..400&display=swap" rel="stylesheet" />
  <!-- CSS personalziado -->
  <link rel="stylesheet" href="../css/catalogo.css" />
  <link rel="stylesheet" href="../css/footer.css" />
  <link rel="stylesheet" href="../css/navBar.css">
</head>

<body>

  <header>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg fixed-top" id="navbar">
      <!-- El contenido se carga dinámicamente con navBar.js -->
    </nav>
  </header>
  <!-- ================================================================================================================ -->
  <main>
    <div class="container-fluid my-4">
      <!-- 🔹 Departamentos: SOLO en escritorio (≥992px) -->
      <div id="departamentos-container" class="d-none d-lg-flex justify-content-center gap-3 flex-wrap mb-4">
        <!-- Aquí se generarán las cards dinámicamente -->
      </div>
    </div>

    <div class="container-fluid">
      <div class="row">
        <!-- Barra lateral de categorias desktop solo se muestra en >=768px -->
        <aside class="d-none d-lg-block col-md-3 col-lg-2 bg-light p-3 categorias-sidebar" id="categorias-sidebar">
          <h2>Categorías</h2>
          <ul id="lista-categorias" class="list-unstyled">
            <!-- Se llenará dinámicamente con JS -->
          </ul>
        </aside>

        <!-- Contenido principal -->
        <div class="col-md-12 col-lg-10 p-4">

          <!-- Dropdown categorías solo en mobile -->
          <div class="d-block d-lg-none mb-3">
            <button class="btn btn-secondary w-100 dropdown-toggle" type="button" data-bs-toggle="dropdown">
              Categorías
            </button>
            <ul class="dropdown-menu w-100" id="lista-categorias-mobile"></ul>
          </div>


          <!-- Cards -->
          <div id="contenedor-productos" class="row row-cols-2 row-cols-md-3 row-cols-lg-4 row-cols-xl-5 g-4">
            <!-- Productos con JS -->
          </div>

        </div>
      </div>
      <!-- ================================================================================================================ -->
      <!-- Barra de paginación -->
      <nav aria-label="Page navigation" class="d-flex justify-content-center mt-4">
        <ul class="pagination justify-content-center"></ul>
      </nav>

      <!-- Barra de paginación -->

      <nav aria-label="Page navigation" class="d-flex justify-content-center mt-4">
        <ul class="pagination justify-content-center"></ul>
      </nav>

      <!-- Modal del carrito -->
      <div class="modal fade" id="carritoModal" tabindex="-1" aria-labelledby="carritoModalLabel" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content overflow-hidden overflow-y-scroll h-90vh">
            <div class="modal-header">
              <h5 class="modal-title" id="carritoModalLabel">
                Carrito de compras
              </h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
              <div class="modal-body">
                <div id="carrito-vacio" class="text-center text-muted py-4">
                  Tu carrito está vacío.
                </div>

                <ul id="carrito-items" class="list-group mb-3"></ul>

                <div id="carrito-resumen" class="d-flex justify-content-between align-items-center">
                  <span class="fw-semibold">Total</span>
                  <span id="carrito-total" class="fw-bold">$0.00</span>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                Cerrar
              </button>
              <button type="button" class="btn btn-danger d-none" id="vaciar-carrito-btn">
                Vaciar carrito
              </button>
              <a class="btn btn-primary" href="../html/carrito.html">Ir a pagar</a>
            </div>
          </div>
        </div>
      </div>

      <!-- FOOTER -->
      <footer class="principal mt-5">
  <div class="container-fluid px-0"id="footer"> <!-- elimina padding lateral -->
    <!-- contenido aquí -->
  </div>
</footer>
    </div>
      <!-- JS Bootstrap -->
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
      <!-- Js Personalizado -->
      <script type="module" src="../js/catalogo.js"></script>
      <script src="../js/footer.js" defer></script>
      <script src="../js/navBar.js" defer></script>
</body>

</html>
