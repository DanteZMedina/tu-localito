<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tu localito - Contacto</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="icon" type="image/png" href="../img/favicon-32x32.png">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css?family=JetBrains+Mono" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playwrite+HU:wght@100..400&display=swap" rel="stylesheet" />
  <!-- CSS personalziado -->
  <link rel="stylesheet" href="../css/contacto.css" />
  <link rel="stylesheet" href="../css/navBar.css" />
</head>

<body class="d-flex flex-column min-vh-100">
  <header>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg fixed-top" id="navbar">
      <!-- El contenido se carga dinámicamente con navBar.js -->
    </nav>
  </header>

  <main class="flex-grow-1">
    <div class="container">
      <div class="row my-4 align-items-center justify-content-center">
        <!-- Formulario -->
        <div class="col-12 col-md-6 d-flex flex-column align-items-center">
          <div class="contact-form">
            <h1>Contacto</h1>
            <form id="contactForm" action="https://formspree.io/f/xrbawdlz" method="POST">
              <label for="name">Nombre:</label>
              <input type="text" id="name" name="name" placeholder="Ejemplo: María" required
                pattern="[A-Za-zÁáÉéÍíÓóÚúÑñÜü]+" title="Solo se permiten letras" />
              <span id="error-name" class="error-message"></span>

              <label for="email">Correo:</label>
              <input type="email" id="email" name="email" placeholder="ejemplo@gmail.com" required />
              <span id="error-email" class="error-message">
              </span>

              <label for="phone">Teléfono:</label>
              <input type="text" id="phone" name="phone" placeholder="Ejemplo a 10 dígitos: 55 5425 1234"
                pattern="[0-9]{10}" maxlength="10" required />
              <span id="phoneError" style="color: red;
                display: none;"></span>

              <label for="message">Mensaje:</label>
              <textarea id="message" name="message" placeholder="Escribe tu mensaje..." required></textarea>
              <div class="d-flex justify-content-end mb-3">
                <button type="submit" class="btn btn-primary">Enviar</button>
              </div>
            </form>
          </div>
        </div>

        <!-- Imagen -->
        <div class="col-12 col-md-6 d-flex justify-content-center">
          <div class="contact-image">
            <img src="../img/contacto/uva.png"
              alt="Racimo de uvas animado con carita feliz, razos y piernas de palo." />
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Modal del carrito -->
  <div class="modal fade" id="carritoModal" tabindex="-1" aria-labelledby="carritoModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="carritoModalLabel">
            Carrito de compras
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <p>Aquí se mostrarán los productos del carrito.</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            Cerrar
          </button>
          <button type="button" class="btn btn-primary">Ir a pagar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="principal mt-5 mt-auto">
    <div class="container-fluid">
      <!-- Redes sociales -->
      <div class="row">
        <div class="footer-about-us d-none d-lg-block col-12 col-lg-4 text-start my-3">
          <a href="./preguntasRespuestas.html" class="d-block">Preguntas Frecuentes</a>
          <a href="sobre_nosotros.html" class="d-block">Sobre nosotros</a>
          <a href="contacto.html" class="d-block active" active>Contacto</a>
        </div>
        <div class="footer-social my-3 col-12 col-lg-4 d-flex justify-content-center align-items-center">
          <a href="#"><img id="footer-social-instagram" src="../img/footer/instagram.png" alt="Instagram" /></a>
          <a href="#"><img id="footer-social-whatsapp" src="../img/footer/whatsapp.png" alt="WhatsApp" /></a>
          <a href="#"><img id="footer-social-facebook" src="../img/footer/facebook.png" alt="Facebook" /></a>
        </div>
        <div class="my-3 d-none d-lg-block col-lg-4 d-flex flex-column text-end justify-content-center">
          <p class="mb-0">Dirección:</p>
          <p class="mb-0">Calle Juan Escutia</p>
          <p class="mb-0">Colonia Roma</p>
        </div>
      </div>

      <div class="row align-items-center">
        <div class="col-12 d-flex justify-content-center">
          <img class="logo-footer" src="../img/footer/tu-localito-logo.png" alt="Tu localito" />
        </div>
      </div>
      <div class="row mt-3 mb-0">
        <div class="col-4 d-none d-lg-block">
          <p class="hecho-en-mexico mb-0">
            Hecho en
            <img src="../img/footer/mexico.png" alt="Bandera de México" />
          </p>
        </div>
        <div class="tu-localito-copyright fst-italic col-md-4 text-center">
          <p class="tu-localito-copyright fst-italic">© 2025 Tu localito</p>
        </div>
        <div class="col-4 text-end d-none d-lg-block">
          <p>Tel: 522 234 2344</p>
        </div>
      </div>
    </div>
  </footer>

  <!-- JS Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/navBar.js"></script>
</body>

</html>
