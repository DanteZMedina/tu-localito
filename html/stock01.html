<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tu Localito - Iventario</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css?family=JetBrains+Mono"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playwrite+HU:wght@100..400&display=swap"
      rel="stylesheet"
    />
    <!-- CSS personalziado -->
    <link rel="stylesheet" href="../css/stock01.css" />
  </head>

  <body>
    <header>
      <!-- NAVBAR -->
      <nav class="navbar navbar-expand-lg fixed-top">
        <div
          class="container-fluid d-flex align-items-center justify-content-between"
        >
          <!-- Contenedor logo mobile -->
          <div class="d-flex d-lg-none flex-grow-1 justify-content-center">
            <a class="navbar-brand m-0" href="#">
              <img
                src="../img/logo-nav-bar.png"
                alt="Logo oficial de Tu localito"
                height="50"
              />
            </a>
          </div>

          <!-- Logo desktop -->
          <a class="navbar-brand d-none d-lg-block me-auto" href="#">
            <img src="../img/logo-nav-bar.png" alt="Logo" height="50" />
          </a>

          <!-- Botón toggler mobile -->
          <button
            class="navbar-toggler ms-auto"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarMenu"
          >
            <span class="navbar-toggler-icon">.</span>
          </button>

          <!-- Menú -->
          <div
            class="collapse navbar-collapse justify-content-end"
            id="navbarMenu"
          >
            <!-- Acciones mobile -->
            <div class="d-lg-none d-flex justify-content-center w-100">
              <div class="acciones mt-3 d-flex gap-3">
                <a
                  class="carrito btn"
                  data-bs-toggle="modal"
                  data-bs-target="#carritoModal"
                  >Cerrar Sesión</a
                >
                <a href="ingresar.html" class="ingresar btn">Mi cuenta</a>
              </div>
            </div>

            <!-- Acciones desktop -->
            <div class="d-none d-lg-flex acciones ms-lg-3 mt-lg-0 gap-3">
              <a
                class="carrito btn"
                data-bs-toggle="modal"
                data-bs-target="#carritoModal"
                >Cerrar Sesión</a
              >
              <a href="ingresar.html" class="ingresar btn">Mi cuenta</a>
            </div>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <div class="container">
        <div class="row my-4">
          <!-- Columna izquierda -->
          <div
            class="col-12 col-lg-8 d-flex flex-column align-items-start new-product-form"
          >
            <button class="btn btn-primary my-3">Agregar Nuevo Producto</button>
            <form id="product-form">
              <div
                class="p-3 d-flex gap-2 align-items-bottom form-container flex-wrap"
              >
                <div class="d-flex flex-column">
                  <label for="product-name">Nombre:</label>
                  <input type="text" id="product-name" />
                </div>
                <div class="d-flex flex-column">
                  <label for="product-department">Departamento:</label>
                  <select id="product-department" name="departments">
                    <option value=""></option>
                    <option value="Alimentos">Alimentos</option>
                    <option value="Bebidas">Bebidas</option>
                    <option value="Productos">Productos de limpieza</option>
                    <option value="Mascotas">Mascotas</option>
                    <option value="Äbarrotes">Abarrotes</option>
                    <option value="Cuidado Personal">Cuidado Personal</option>
                  </select>
                </div>
                <div class="d-flex flex-column">
                  <label for="product-category">Categoría:</label>
                  <select id="product-category" name="categories">
                    <option value=""></option>
                    <option value="Refrescos">Refrescos</option>
                  </select>
                </div>
                <div class="d-flex flex-column">
                  <label for="product-sku">SKU:</label>
                  <input type="text" id="product-sku" />
                </div>
                <div class="d-flex flex-column">
                  <label for="product-stock">Cantidad:</label>
                  <input type="text" id="product-stock" />
                </div>
                <div class="d-flex flex-column">
                  <label for="product-unit">Unidad:</label>
                  <select id="product-unit">
                    <option value="Alimentos">Pza</option>
                    <option value="opcion2">L</option>
                    <option value="opcion3">Kg</option>
                  </select>
                </div>
                <div class="d-flex flex-column">
                  <label for="product-price">Precio:</label>
                  <input type="text" id="product-price" />
                </div>
                <div
                  class="d-flex flex-column align-items-center justify-content-end"
                >
                  <button class="btn btn-primary my-0" id="btn-add-picture">
                    <img src="../img/stock/add-picture-icon.png" alt="" />
                  </button>
                </div>
              </div>
              <div class="m-3 gap-2 d-flex justify-content-end">
                <button class="btn btn-primary" type="submit">Guardar</button>
                <button class="btn" id="btn-add">
                  <i class="bi bi-plus-lg"> + </i>
                </button>
              </div>
            </form>
          </div>

          <!-- Columna derecha -->
          <div class="col-12 col-lg-4 d-flex justify-content-end mt-4 mt-lg-0">
            <aside class="panel-lateral card p-3 shadow-sm h-fit w-100">
              <h5 class="fw-bold mb-3">Palabras relacionadas</h5>
              <div class="tags mb-3">
                <span class="tag"
                  >Frutas <button class="btn-close btn-sm"></button
                ></span>
                <span class="tag"
                  >Granel <button class="btn-close btn-sm"></button
                ></span>
                <span class="tag"
                  >Verduras <button class="btn-close btn-sm"></button
                ></span>
                <span class="tag"
                  >Promociones <button class="btn-close btn-sm"></button
                ></span>
                <span class="tag"
                  >Nuevos <button class="btn-close btn-sm"></button
                ></span>
              </div>

              <div class="mb-3">
                <label for="stock-alert" class="form-label"
                  >Alerta de Stock:</label
                >
                <input
                  type="number"
                  id="stock-alert"
                  class="form-control"
                  value="5"
                />
              </div>

              <div class="mb-4">
                <label for="ordenar" class="form-label">Ordenar por:</label>
                <input
                  type="text"
                  id="ordenar"
                  class="form-control"
                  value="Nombre"
                />
              </div>
            </aside>
          </div>
        </div>
      </div>
    </main>


    <!-- FOOTER -->
    <footer class="principal mt-5">
      <div class="container-fluid">
        <!-- Redes sociales -->
        <div class="row">
          <div
            class="footer-about-us d-none d-lg-block col-12 col-lg-4 text-start my-3"
          >
            <a href="#" class="d-block">Preguntas Frecuentes</a>
            <a href="sobre_nosotros.html" class="d-block">Sobre nosotros</a>
            <a href="contacto.html" class="d-block">Contacto</a>
          </div>
          <div
            class="footer-social my-3 col-12 col-lg-4 d-flex justify-content-center align-items-center"
          >
            <a href="#"
              ><img
                id="footer-social-instagram"
                src="../img/footer/instagram.png"
                alt="Instagram"
            /></a>
            <a href="#"
              ><img
                id="footer-social-whatsapp"
                src="../img/footer/whatsapp.png"
                alt="WhatsApp"
            /></a>
            <a href="#"
              ><img
                id="footer-social-facebook"
                src="../img/footer/facebook.png"
                alt="Facebook"
            /></a>
          </div>
          <div
            class="my-3 d-none d-lg-block col-lg-4 d-flex flex-column text-end justify-content-center"
          >
            <p class="mb-0">Dirección:</p>
            <p class="mb-0">Calle Juan Escutia</p>
            <p class="mb-0">Colonia Roma</p>
          </div>
        </div>

        <div class="row align-items-center">
          <div class="col-12 d-flex justify-content-center">
            <img
              class="logo-footer"
              src="../img/footer/tu-localito-logo.png"
              alt="Tu localito"
            />
          </div>
        </div>
        <div class="row mt-3 mb-0">
          <div class="col-4 d-none d-lg-block">
            <p class="hecho-en-mexico mb-0">
              Hecho en
              <img src="../img/footer/mexico.png" alt="Bandera de México" />
            </p>
          </div>
          <div class="tu-localito-copyright fst-italic col-md-4 text-center">
            <p class="tu-localito-copyright fst-italic">© 2025 Tu localito</p>
          </div>
          <div class="col-4 text-end d-none d-lg-block">
            <p>Tel: 522 234 2344</p>
          </div>
        </div>
      </div>
    </footer>

    <!-- JS Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/stock.js" type="module"></script>

  </body>
</html>
