<!DOCTYPE html>
<html lang="es">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

 <!-- Bootstrap CSS -->

      rel="stylesheet"
    />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css?family=JetBrains+Mono"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playwrite+HU:wght@100..400&display=swap"
      rel="stylesheet"
    />

<!-- CSS personalizado -->
<link rel="stylesheet" href="../css/catalogo.css">
<link rel="stylesheet" href="../css/preguntasRespuestas.css">

<body>
    <header>
        <!-- NAVBAR -->
        <nav class="navbar navbar-expand-lg fixed-top">
            <div class="container-fluid d-flex align-items-center justify-content-between">
                <!-- Contenedor logo mobile -->
                <div class="d-flex d-lg-none flex-grow-1 justify-content-center">
                    <a class="navbar-brand m-0" href="#">
                        <img src="../img/logo-nav-bar.png" alt="Logo oficial de Tu localito" height="50" />
                    </a>
                </div>

                <!-- Logo desktop -->
                <a class="navbar-brand d-none d-lg-block me-auto" href="#">
                    <img src="../img/logo-nav-bar.png" alt="Logo" height="50" />
                </a>

                <!-- Botón toggler mobile -->
                <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarMenu">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Menú -->
                <div class="collapse navbar-collapse" id="navbarMenu">
                    <div
                        class="d-flex flex-column flex-lg-row align-items-start align-items-lg-center w-100 justify-content-lg-center gap-3 menu">
                        <a href="../index.html">Inicio</a>
                        <a href="catalogo.html">Catálogo</a>
                        <a href="sobre_nosotros.html">Sobre Nosotros</a>
                        <a href="contacto.html">Contacto</a>
                    </div>

                    <!-- Acciones mobile -->
                    <div class="d-lg-none d-flex justify-content-center w-100">
                        <div class="acciones mt-3 d-flex gap-3">
                            <a id="carrito-btn-mobile"
                                class="carrito btn position-relative d-inline-flex align-items-center"
                                data-bs-toggle="modal" data-bs-target="#carritoModal">
                                <i class="bi bi-cart3 me-2" aria-hidden="true"></i>
                                Carrito
                                <!-- 🟡 Badge contador con color de la página -->
                                <span id="carrito-count-mobile"
                                    class="carrito-count position-absolute top-0 start-0 translate-middle badge rounded-pill">
                                    0
                                </span>
                            </a>
                            <a href="ingresar.html" class="ingresar btn">Mi perfil</a>
                        </div>
                    </div>

                    <!-- Acciones desktop -->
                    <div class="d-none d-lg-flex acciones ms-lg-3 mt-lg-0 gap-3">
                        <a id="carrito-btn-desktop"
                            class="carrito btn position-relative d-inline-flex align-items-center"
                            data-bs-toggle="modal" data-bs-target="#carritoModal">
                            <i class="bi bi-cart3 me-2" aria-hidden="true"></i>
                            Carrito
                            <!-- 🟡 Badge contador con color de la página -->
                            <span id="carrito-count-desktop"
                                class="carrito-count position-absolute top-0 start-0 translate-middle badge rounded-pill">
                                0
                            </span>
                        </a>
                        <a href="ingresar.html" class="ingresar btn">Mi perfil</a>
                    </div>


                </div>
            </div>
        </nav>
    </header>

    <main class="main">
        <!-- Contenido dinámico se renderiza aquí -->
    </main>
    <!--Footer-->
  <footer class="principal mt-5 mt-auto" >
      <div class="container-fluid"id="footer"></div>
    </footer>
    </div>
    <!-- JS Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/preguntasRespuestas.js"></script>
    <script src="../js/footer.js" defer></script>
</body>

</html>
