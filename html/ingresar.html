<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tu Localito - Ingresar</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="icon" type="image/png" href="../img/favicon-32x32.png">
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css?family=JetBrains+Mono"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playwrite+HU:wght@100..400&display=swap"
      rel="stylesheet"
    />
    <!-- CSS personalziado -->
    <link rel="stylesheet" href="../css/ingresar.css" />
    <link rel="stylesheet" href="../css/footer.css" />
  </head>
  <body>
    <header>
      <!-- NAVBAR -->
      <nav class="navbar navbar-expand-lg fixed-top" id="navbar">
      </nav>
    </header>

    <main>
      <div class="container my-5">
        <div class="row d-flex align-items-center justify-content-center">
          <section class="log-in col-12 col-md-6">
            <h1>Iniciar Sesión</h1>
            <form id="formulario-login" class="contact-form" action="#" method="post">
              <!-- Correo -->
              <label for="email">Correo:</label>
              <div class="input-group">
                <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="ejemplo@gmail.com"
                  class="form-control mb-1"
                />
              </div>

              <!-- Contraseña -->
              <label for="password">Contraseña:</label>
              <div class="input-group">
                <input type="password" id="password" name="password" class="form-control mb-1" />
              </div>
              <div class="actions-container d-flex flex-column align-items-center mb-3">
                <a href="#" class="forgot-link mb-2"
                  >¿Olvidaste tu contraseña?</a
                >
                <button type="submit" class="btn-primary">Iniciar</button>
              </div>
            </form>
          </section>
          <section class="register col-12 col-lg-4 text-center">
            <h2>¿No tienes cuenta?</h2>
            <a class="btn-primary mb-2" href="registro.html"><button class="btn-register">Regístrate</button></a>
            <p>Conecta tu cuenta con:</p>
            <div class="d-flex justify-content-center">
              <a class="btn-google">
                <img src="../img/ingresar/google-logo.png" alt="Google" />
              </a>
            </div>
          </section>
        </div>
      </div>
      <img class="cereza d-none d-lg-flex" src="../img/ingresar/cereza.png" alt="Cereza animada" />
    </main>

    <!-- Modal del carrito -->
    <div
      class="modal fade"
      id="carritoModal"
      tabindex="-1"
      aria-labelledby="carritoModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="carritoModalLabel">
              Carrito de compras
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Cerrar"
            ></button>
          </div>
          <div class="modal-body">
            <p>Aquí se mostrarán los productos del carrito.</p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cerrar
            </button>
            <button type="button" class="btn btn-primary">Ir a pagar</button>
          </div>
        </div>
      </div>
    </div>


   <!------------------footer-------------------->
      <footer class="principal mt-5 mt-auto" >
      <div class="container-fluid"id="footer"></div>
    </footer>


    <!-- JS Bootstrap -->
      <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/ingresar.js"></script>
    <script src="../js/footer.js" defer></script>
    <script src="../js/navBar.js"></script>
  </body>
</html>
