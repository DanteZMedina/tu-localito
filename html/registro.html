<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tu Localito - Ingresar</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="icon" type="image/png" href="../img/favicon-32x32.png">

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css?family=JetBrains+Mono"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playwrite+HU:wght@100..400&display=swap"
      rel="stylesheet"
    />
    <!-- CSS personalizado -->
    <link rel="stylesheet" href="../css/ingresar.css" />
    <link rel="stylesheet" href="../css/registro.css" />
    <link rel="stylesheet" href="../css/footer.css" />
    <link rel="stylesheet" href="../css/catalogo.css">
  </head>

  <body>
    <header>
      <!-- NAVBAR -->
      <nav class="navbar navbar-expand-lg fixed-top" id="navbar">
        
      </nav>
    </header>

    <!--Interfaz de codigo postal-->
    <main>
      <!--VALIDACIÓN CÓDIGO POSTAL-->
      <section id="registro-cp" class="registro container mt-4">
        <div class="row d-flex justify-content-center">
          <div class="col-12 col-lg-6 my-2">
            <form class="contact-form" id="zona-form">
              <div class="mb-3">
                <h1>Crea tu cuenta</h1>
                <label for="codigo-postal" class="form-label d-flex"
                  >Código Postal:</label
                >
                <div class="d-flex align-items-center">
                  <input
                    type="number"
                    id="codigo-postal-cp"
                    name="postalCode"
                    class="form-control mb-0"
                  />
                  <button id="boton-registro" class="btn btn-primary mx-3">
                    Registrar
                  </button>
                </div>
                <p id="mensaje-error" class="mensaje text-start"></p>
              </div>
            </form>
          </div>
          <div class="d-flex justify-content-center">
            <img
              src="../img/ingresar/pera.png"
              alt="mascota de pera de tu localito"
              class="pera"
            />
          </div>
        </div>
      </section>

      <!--FORMULARIO COMPLETO-->
      <section
        id="formulario-completo"
        class="registro-completo container mt-4"
      >
        <div class="row">
          <div class="form-completo col-8">
            <h1 class="d-flex">Crea tu cuenta</h1>
            <form class="contact-form row" id="formulario-completo-form">
              <div class="col-md-6">
                <div class="mb-1">
                  <label for="codigo-postal" class="form-label"
                    >Código Postal:</label
                  >
                  <input
                    type="text"
                    id="codigo-postal"
                    name="postalCode"
                    class="form-control"
                    readonly
                  />
                </div>
                <div class="mb-1">
                  <label for="nombre" class="form-label">Nombre:</label>
                  <input
                    type="text"
                    id="nombre"
                    name="personalName"
                    class="form-control"
                  />
                </div>
                <div class="mb-1">
                  <label for="primer-apellido" class="form-label"
                    >Primer Apellido:</label
                  >
                  <input
                    type="text"
                    id="primer-apellido"
                    name="personalLastName"
                    class="form-control"
                  />
                </div>
                <div class="mb-1">
                  <label for="personalPhone" class="form-label"
                    >Teléfono:</label
                  >
                  <input
                    type="text"
                    id="personalPhone"
                    name="personalPhone"
                    class="form-control"
                  />
                </div>
              </div>
              <div class="col-md-6">
                <div class="mb-1">
                  <label for="correo" class="form-label">Correo:</label>
                  <input
                    type="email"
                    id="correo"
                    name="userEmail"
                    class="form-control"
                  />
                </div>
                <div class="mb-1">
                  <label for="contraseña" class="form-label">Contraseña:</label>
                  <input
                    type="password"
                    name="password"
                    id="contraseña"
                    class="form-control"
                  />
                </div>
                <div class="mb-1">
                  <label for="contraseña-validada" class="form-label">
                    Volver a escribir tu contraseña:
                  </label>
                  <input
                    type="password"
                    id="contraseña-validada"
                    name="confirmPassword"
                    class="form-control"
                  />
                </div>
                <div class="d-flex justify-content-end mt-5">
                  <button type="submit" class="btn btn-primary">Registrar</button>
                </div>
              </div>
            </form>
          </div>
          <div class="contenedor-imagen col-md-4 d-flex align-items-center">
            <img
              class="pera-de-cabeza mx-5"
              src="../img/ingresar/pera.png"
              alt="Pera animada sorprendida"
            />
          </div>
        </div>
      </section>
    </main>

    <!-- Modal del carrito -->
    <div
      class="modal fade"
      id="carritoModal"
      tabindex="-1"
      aria-labelledby="carritoModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="carritoModalLabel">
              Carrito de compras
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Cerrar"
            ></button>
          </div>
          <div class="modal-body">
            <p>Aquí se mostrarán los productos del carrito.</p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cerrar
            </button>
            <button type="button" class="btn btn-primary">Ir a pagar</button>
          </div>
        </div>
      </div>
    </div>

    <!--Footer-->
  <footer class="principal mt-5 mt-auto" >
      <div class="container-fluid"id="footer"></div>
    </footer>
    </div>

    <!-- JS Bootstrap --><!-- Bootstrap 4 JS and dependencies -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <!-- JS -->

    <script src="../js/registro.js"></script>
    <script src="../js/footer.js" defer></script>
    <script src="../js/navBar.js"></script>
  </body>
</html>
