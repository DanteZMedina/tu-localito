<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu localito - Carrito</title>

    <!-- Fuentes -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500&display=swap"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Bootstrap CSS (necesario para navbar) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Estilos del navbar (reutilizamos el de catálogo) -->
    <link rel="stylesheet" href="../css/catalogo.css">
    <!-- Estilos propios del carrito (van al final para que puedan sobrescribir si hace falta) -->
    <link rel="stylesheet" href="../css/carrito.css">
</head>

<body>

    <!-- ======================= NAVBAR ======================= -->
    <header>
        <nav class="navbar navbar-expand-lg fixed-top">
            <div class="container-fluid d-flex align-items-center justify-content-between">
                <!-- Contenedor logo mobile -->
                <div class="d-flex d-lg-none flex-grow-1 justify-content-center">
                    <a class="navbar-brand m-0" href="#">
                        <img src="../img/logo-nav-bar.png" alt="Logo oficial de Tu localito" height="50" />
                    </a>
                </div>

                <!-- Logo desktop -->
                <a class="navbar-brand d-none d-lg-block me-auto" href="../index.html">
                    <img src="../img/logo-nav-bar.png" alt="Logo" height="50" />
                </a>

                <!-- Botón toggler mobile -->
                <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarMenu">
                    <span class="navbar-toggler-icon">.</span>
                </button>

                <!-- Menú -->
                <div class="collapse navbar-collapse" id="navbarMenu">
                    <div
                        class="d-flex flex-column flex-lg-row align-items-start align-items-lg-center w-100 justify-content-lg-center gap-3 menu">
                        <a href="../index.html">Inicio</a>
                        <a href="catalogo.html">Catálogo</a>
                        <a href="sobre_nosotros.html">Sobre Nosotros</a>
                        <a href="contacto.html">Contacto</a>
                    </div>

                    <!-- Acciones mobile -->
                    <div class="d-lg-none d-flex justify-content-center w-100">
                        <div class="acciones mt-3 d-flex gap-3">
                            <a href="ingresar.html" class="ingresar btn">Mi perfil</a>
                        </div>
                    </div>

                    <!-- Acciones desktop -->
                    <div class="d-none d-lg-flex acciones ms-lg-3 mt-lg-0 gap-3">
                        <a href="ingresar.html" class="ingresar btn">Mi perfil</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>
    <!-- ====================================================== -->

    <div class="container shadow">
        <div class="header">
            <h1 class="titulo-carrito">Carrito de Compras</h1>
        </div>

        <div class="main-content">
            <main class="productos-lista" id="productos-lista"></main>

            <aside class="resumen-wrapper">
                <div class="resumen-container">
                    <h3 class="resumen-titulo">Resumen de compra</h3>

                    <div class="resumen-linea">
                        <span>Subtotal</span>
                        <span id="subtotal-valor">$0.00</span>
                    </div>

                    <div class="resumen-linea">
                        <span>Envío</span>
                        <span id="envio-valor">$50.00</span>
                    </div>

                    <div class="total-container">
                        <span id="total-valor">$0.00</span>
                        <span class="total-label">Total</span>
                    </div>

                    <button class="btn-finalizar" onclick="finalizarCompra()">Finalizar compra</button>
                    <button class="btn-seguir" onclick="seguirComprando()">Seguir Comprando</button>
                </div>
            </aside>
        </div>
    </div>

    <footer class="principal mt-5">
        <div class="container-fluid">
            <!-- Redes sociales -->
            <div class="row">
                <div class="footer-about-us d-none d-lg-block col-12 col-lg-4 text-start my-3">
                    <a href="#" class="d-block">Preguntas Frecuentes</a>
                    <a href="sobre_nosotros.html" class="d-block">Sobre nosotros</a>
                    <a href="contacto.html" class="d-block">Contacto</a>
                </div>
                <div class="footer-social my-3 col-12 col-lg-4 d-flex justify-content-center align-items-center">
                    <a href="#"><img id="footer-social-instagram" src="../img/footer/instagram.png"
                            alt="Instagram" /></a>
                    <a href="#"><img id="footer-social-whatsapp" src="../img/footer/whatsapp.png" alt="WhatsApp" /></a>
                    <a href="#"><img id="footer-social-facebook" src="../img/footer/facebook.png" alt="Facebook" /></a>
                </div>
                <div class="my-3 d-none d-lg-block col-lg-4 d-flex flex-column text-end justify-content-center">
                    <p class="mb-0">Dirección:</p>
                    <p class="mb-0">Calle Juan Escutia</p>
                    <p class="mb-0">Colonia Roma</p>
                </div>
            </div>

            <div class="row align-items-center">
                <div class="col-12 d-flex justify-content-center">
                    <img class="logo-footer" src="../img/footer/tu-localito-logo.png" alt="Tu localito" />
                </div>
            </div>
            <div class="row mt-3 mb-0">
                <div class="col-4 d-none d-lg-block">
                    <p class="hecho-en-mexico mb-0">
                        Hecho en
                        <img src="../img/footer/mexico.png" alt="Bandera de México" />
                    </p>
                </div>
                <div class="tu-localito-copyright fst-italic col-md-4 text-center">
                    <p class="tu-localito-copyright fst-italic">© 2025 Tu localito</p>
                </div>
                <div class="col-4 text-end d-none d-lg-block">
                    <p>Tel: 522 234 2344</p>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS (para navbar colapsable) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- JS propio -->
    <script src="../js/carrito.js"></script>
</body>

</html>
