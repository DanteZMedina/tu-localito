<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tu Localito - Inicio</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css?family=JetBrains+Mono"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playwrite+HU:wght@100..400&display=swap"
      rel="stylesheet"
    />
    <!-- CSS personalziado -->
    <link rel="stylesheet" href="css/index.css" />
  </head>
  <body>
    <header>
      <!-- NAVBAR -->
      <nav class="navbar navbar-expand-lg fixed-top">
        <div
          class="container-fluid d-flex align-items-center justify-content-between"
        >
          <!-- Contenedor logo mobile -->
          <div class="d-flex d-lg-none flex-grow-1 justify-content-center">
            <a class="navbar-brand m-0" href="#">
              <img
                src="img/logo-nav-bar.png"
                alt="Logo oficial de Tu localito"
                height="50"
              />
            </a>
          </div>

          <!-- Logo desktop -->
          <a class="navbar-brand d-none d-lg-block me-auto" href="#">
            <img src="img/logo-nav-bar.png" alt="Logo" height="50" />
          </a>

          <!-- Botón toggler mobile -->
          <button
            class="navbar-toggler ms-auto"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarMenu"
          >
            <span class="navbar-toggler-icon">.</span>
          </button>

          <!-- Menú -->
          <div class="collapse navbar-collapse" id="navbarMenu">
            <div
              class="d-flex flex-column flex-lg-row align-items-start align-items-lg-center w-100 justify-content-lg-center gap-3 menu"
            >
              <a href="index.html" class="active">Inicio</a>
              <a href="html/catalogo.html">Catálogo</a>
              <a href="html/sobre_nosotros.html">Sobre Nosotros</a>
              <a href="html/contacto.html">Contacto</a>
              <a href="html/stock01.html">Inventario</a>
            </div>

            <!-- Acciones mobile -->
            <div class="d-lg-none d-flex justify-content-center w-100">
              <div class="acciones mt-3 d-flex gap-3">
                <a
                  class="carrito btn"
                  data-bs-toggle="modal"
                  data-bs-target="#carritoModal"
                  >Carrito</a
                >
                <a href="html/ingresar.html" class="ingresar btn">Ingresar</a>
              </div>
            </div>

            <!-- Acciones desktop -->
            <div class="d-none d-lg-flex acciones ms-lg-3 mt-lg-0 gap-3">
              <a
                class="carrito btn"
                data-bs-toggle="modal"
                data-bs-target="#carritoModal"
                >Carrito</a
              >
              <a href="html/ingresar.html" class="ingresar btn">Ingresar</a>
            </div>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <div class="container">
        <div class="row my-4 align-items-center justify-content-center">
          <div class="col-12 d-flex flex-column align-items-center">
            <img src="img/trabajando.png" alt="Página en desarrollo" />
          </div>
          <div class="col-12 col-md-6 d-flex flex-column align-items-center">
            <h1>Inicio</h1>
          </div>
        </div>
      </div>
    </main>

    <!-- Modal del carrito -->
    <div
      class="modal fade"
      id="carritoModal"
      tabindex="-1"
      aria-labelledby="carritoModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="carritoModalLabel">
              Carrito de compras
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Cerrar"
            ></button>
          </div>
          <div class="modal-body">
            <p>Aquí se mostrarán los productos del carrito.</p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cerrar
            </button>
            <button type="button" class="btn btn-primary">Ir a pagar</button>
          </div>
        </div>
      </div>
    </div>

    <!-- FOOTER -->
    <footer class="principal mt-5">
      <div class="container-fluid">
        <!-- Redes sociales -->
        <div class="row">
          <div
            class="footer-about-us d-none d-lg-block col-12 col-lg-4 text-start my-3"
          >
            <a href="#" class="d-block">Preguntas Frecuentes</a>
            <a href="html/sobre_nosotros.html" class="d-block">Sobre nosotros</a>
            <a href="html/contacto.html" class="d-block">Contacto</a>
          </div>
          <div
            class="footer-social my-3 col-12 col-lg-4 d-flex justify-content-center align-items-center"
          >
            <a href="#"
              ><img
                id="footer-social-instagram"
                src="img/footer/instagram.png"
                alt="Instagram"
            /></a>
            <a href="#"
              ><img
                id="footer-social-whatsapp"
                src="img/footer/whatsapp.png"
                alt="WhatsApp"
            /></a>
            <a href="#"
              ><img
                id="footer-social-facebook"
                src="img/footer/facebook.png"
                alt="Facebook"
            /></a>
          </div>
          <div
            class="my-3 d-none d-lg-block col-lg-4 d-flex flex-column text-end justify-content-center"
          >
            <p class="mb-0">Dirección:</p>
            <p class="mb-0">Calle Juan Escutia</p>
            <p class="mb-0">Colonia Roma</p>
          </div>
        </div>

        <div class="row align-items-center">
          <div class="col-12 d-flex justify-content-center">
            <img
              class="logo-footer"
              src="img/footer/tu-localito-logo.png"
              alt="Tu localito"
            />
          </div>
        </div>
        <div class="row mt-3 mb-0">
          <div class="col-4 d-none d-lg-block">
            <p class="hecho-en-mexico mb-0">
              Hecho en
              <img src="img/footer/mexico.png" alt="Bandera de México" />
            </p>
          </div>
          <div class="tu-localito-copyright fst-italic col-md-4 text-center">
            <p class="tu-localito-copyright fst-italic">© 2025 Tu localito</p>
          </div>
          <div class="col-4 text-end d-none d-lg-block">
            <p>Tel: 522 234 2344</p>
          </div>
        </div>
      </div>
    </footer>

    <!-- JS Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
